     stay invisible, otherwise a slide flashes its last step before step 1.
     slideui.js removes the attribute after the first painted frame. */
  html[data-slideui-init] *,

  html[data-slideui-init] *::after{transition:none!important;animation:none!important}

  /* ---- fixed 1280x720 canvas, scaled to the window by slideui.js ---- */
  .slide-layout{position:absolute;left:50%;top:50%;width:1280px;height:720px;
    transform:translate(-50%,-50%) scale(var(--slide-scale,1));transform-origin:center;
    overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);
    -webkit-font-smoothing:antialiased;container-type:size;
    /* Bottom band reserved for the slide counter, so the number never sits on
       content. Everything inside .slide therefore gets 68 px less height. */
    padding:0 0 68px}

    gap:7px;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums;

function sync(){if(frame!==null)cancelAnimationFrame(frame);frame=null;startTime=0;paint(1);if(Number(slide.dataset.build)===5&&!motion.matches&&!document.hidden&&inView&&!document.documentElement.hasAttribute('data-slideui-init'))frame=requestAnimationFrame(tick);}
new MutationObserver(sync).observe(slide,{attributes:true,attributeFilter:['data-build']});
new MutationObserver(function(){if(!document.documentElement.hasAttribute('data-slideui-init'))sync();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-slideui-init']});
motion.addEventListener('change',sync);document.addEventListener('visibilitychange',sync);
if('IntersectionObserver' in window)new IntersectionObserver(function(es){if(es[0].isIntersecting!==inView){inView=es[0].isIntersecting;sync();}},{threshold:.01}).observe(slide);
sync();}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();})();
</script></body></html>
