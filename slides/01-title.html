<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Beyond Conventional Deep Learning</title>
  <link rel="stylesheet" href="slideui.css">
  <script src="slideui.js" defer></script>
  <style>
    .arrow { font-size: 2rem; font-weight: bold; line-height: 1; color: #94a3b8; display: inline-block; }
    .arrow-right { animation: nudge-x 1.2s ease-in-out infinite; }
    .arrow-down { animation: nudge-y 1.2s ease-in-out infinite; }
    @keyframes nudge-x { 0%, 100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
    @keyframes nudge-y { 0%, 100% { transform: translateY(-4px); } 50% { transform: translateY(4px); } }
  </style>
</head>
<body>
<!-- BUDGET: cover slide, tier L. B = 556px (no subtitle block in header) = illustration ~190 + gap 16 + title ~80 + gap 12 + subtitle ~64 + gap 16 + footer (course + authors) ~100 = ~478px (86%); flex wrapper spreads the remainder; bottom 60px kept empty -->

<div class="slide-layout" style="padding: 32px 48px 60px; justify-content: flex-start; background: linear-gradient(160deg, #0b1a3a 0%, #0a1330 55%, #07102a 100%); color: #e2e8f0;">

  <!-- Body: fills the usable height -->
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;">

    <!-- Illustration: SNN (left, cyan) blending into GNN (right, orange) -->
    <div data-step="1" style="flex: 1.3; display: flex; align-items: center; justify-content: center; min-height: 0;">
      <svg width="100%" height="200" viewBox="0 0 1184 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Cyan to orange blend for the central unified network -->
          <linearGradient id="blend" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#22d3ee"/>
            <stop offset="1" stop-color="#fb923c"/>
          </linearGradient>
          <!-- Left fades out toward the center, right fades in -->
          <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
            <stop offset="1" stop-color="#22d3ee" stop-opacity="0.25"/>
          </linearGradient>
          <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fb923c" stop-opacity="0.25"/>
            <stop offset="1" stop-color="#fb923c" stop-opacity="0.9"/>
          </linearGradient>
          <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="glowO" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#fb923c" stop-opacity="0.6"/>
            <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Subtle temporal waveform behind the SNN side -->
        <path d="M0 100 C40 40 70 160 110 100 S180 40 220 100 S290 160 330 100 S400 50 440 100 S510 140 550 100" stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.25"/>

        <!-- SNN: layered neurons, left -->
        <g stroke="url(#fadeL)" stroke-width="1.5" fill="none">
          <path d="M60 50L180 30"/><path d="M60 50L180 85"/><path d="M60 100L180 30"/><path d="M60 100L180 85"/><path d="M60 100L180 140"/><path d="M60 150L180 85"/><path d="M60 150L180 140"/><path d="M60 150L180 175"/>
          <path d="M180 30L300 55"/><path d="M180 85L300 55"/><path d="M180 85L300 110"/><path d="M180 140L300 110"/><path d="M180 140L300 160"/><path d="M180 175L300 160"/>
          <path d="M300 55L420 80"/><path d="M300 110L420 80"/><path d="M300 110L420 125"/><path d="M300 160L420 125"/>
        </g>
        <g fill="#22d3ee">
          <circle cx="60" cy="50" r="7"/><circle cx="60" cy="100" r="7"/><circle cx="60" cy="150" r="7"/>
          <circle cx="180" cy="30" r="7"/><circle cx="180" cy="85" r="9"/><circle cx="180" cy="140" r="7"/><circle cx="180" cy="175" r="7"/>
          <circle cx="300" cy="55" r="7"/><circle cx="300" cy="110" r="9"/><circle cx="300" cy="160" r="7"/>
          <circle cx="420" cy="80" r="7" fill-opacity="0.7"/><circle cx="420" cy="125" r="7" fill-opacity="0.7"/>
        </g>
        <!-- Glowing spikes -->
        <circle cx="180" cy="85" r="26" fill="url(#glowC)"/>
        <circle cx="300" cy="110" r="26" fill="url(#glowC)"/>
        <g stroke="#a5f3fc" stroke-width="2.5" stroke-linecap="round">
          <path d="M120 58L132 50"/><path d="M240 98L252 90"/><path d="M360 96L372 100"/>
        </g>

        <!-- Central blend: unified network, cyan to orange -->
        <g stroke="url(#blend)" stroke-width="2" fill="none">
          <path d="M420 80L520 60"/><path d="M420 80L540 110"/><path d="M420 125L540 110"/><path d="M420 125L520 160"/>
          <path d="M520 60L640 80"/><path d="M540 110L640 80"/><path d="M540 110L640 135"/><path d="M520 160L640 135"/>
          <path d="M520 60L540 110"/><path d="M540 110L520 160"/>
          <path d="M640 80L760 60"/><path d="M640 80L760 110"/><path d="M640 135L760 110"/><path d="M640 135L760 165"/>
        </g>
        <g>
          <circle cx="520" cy="60" r="8" fill="#22d3ee"/><circle cx="540" cy="110" r="10" fill="#67e8f9"/><circle cx="520" cy="160" r="8" fill="#38bdf8"/>
          <circle cx="640" cy="80" r="9" fill="#94a3b8"/><circle cx="640" cy="135" r="9" fill="#cbd5e1"/>
          <circle cx="760" cy="60" r="8" fill="#fdba74"/><circle cx="760" cy="110" r="10" fill="#fb923c"/><circle cx="760" cy="165" r="8" fill="#fdba74"/>
        </g>
        <circle cx="592" cy="105" r="44" fill="url(#glowC)" opacity="0.7"/>

        <!-- GNN: irregular graph, right -->
        <g stroke="url(#fadeR)" stroke-width="1.5" fill="none">
          <path d="M760 60L880 30"/><path d="M760 60L850 120"/><path d="M760 110L850 120"/><path d="M760 110L880 30"/><path d="M760 165L850 120"/><path d="M760 165L900 170"/>
          <path d="M880 30L1010 70"/><path d="M850 120L1010 70"/><path d="M850 120L960 130"/><path d="M900 170L960 130"/><path d="M1010 70L1100 40"/><path d="M1010 70L1080 120"/><path d="M960 130L1080 120"/><path d="M1080 120L1130 170"/><path d="M1100 40L1130 100"/><path d="M960 130L1010 70"/>
        </g>
        <!-- Message-passing arrows into highlighted node -->
        <g stroke="#fb923c" stroke-width="3" stroke-linecap="round" fill="none">
          <path d="M886 38L960 62"/><path d="M1000 74L1000 74"/>
        </g>
        <g fill="#fb923c">
          <circle cx="880" cy="30" r="8"/><circle cx="850" cy="120" r="11"/><circle cx="1010" cy="70" r="9"/><circle cx="960" cy="130" r="8" fill-opacity="0.75"/>
          <circle cx="900" cy="170" r="7" fill-opacity="0.75"/><circle cx="1100" cy="40" r="7" fill-opacity="0.75"/><circle cx="1080" cy="120" r="9"/><circle cx="1130" cy="170" r="7" fill-opacity="0.6"/><circle cx="1130" cy="100" r="7" fill-opacity="0.6"/>
        </g>
        <circle cx="850" cy="120" r="30" fill="url(#glowO)"/>
        <circle cx="1080" cy="120" r="28" fill="url(#glowO)"/>
        <!-- Message arrows toward highlighted nodes -->
        <g stroke="#fed7aa" stroke-width="2.5" stroke-linecap="round" fill="none">
          <path d="M800 90L832 114"/><path d="M880 140L862 128"/>
          <path d="M1040 90L1066 112"/><path d="M1108 134L1092 126"/>
        </g>
      </svg>
    </div>

    <!-- Title block -->
    <div data-step="2" style="flex: none; text-align: center;">
      <div class="title" style="font-size: 4rem; margin: 0 0 8px 0; color: #ffffff; letter-spacing: 0.5px; line-height: 1.1;">Beyond Conventional Deep Learning</div>
      <div class="subtitle" style="font-size: 1.5rem; margin: 0; color: #cbd5e1; line-height: 1.4;">
        <span style="color: #22d3ee; font-weight: 700;">Spiking Neural Networks</span> and <span style="color: #fb923c; font-weight: 700;">Graph Neural Networks</span>:<br>Temporal Dynamics and Relational Structure
      </div>
    </div>

    <!-- Footer: course + authors -->
    <div data-step="3" style="flex: none; text-align: center; border-top: 1px solid rgba(148,163,184,0.35); padding-top: 12px;">
      <div style="font-size: 1.25rem; font-weight: 700; line-height: 1.4; color: #67e8f9; margin: 0 0 4px 0; letter-spacing: 1px;">Big Data &amp; Deep Learning</div>
      <div style="font-size: 1.05rem; line-height: 1.5; color: #e2e8f0; margin: 0;">Mattia Sicoli · Matteo Scuratti · Yehia Abdallah · Gabriele Tondi · Fabio Moliterno · Lorenzo Mariotti</div>
    </div>
  </div>
</div>

</body>
</html>
