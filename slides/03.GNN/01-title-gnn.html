<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Graph Neural Networks</title>
  <link rel="stylesheet" href="slideui.css">
  <script src="slideui.js" defer></script>
  <style>
    .arrow { font-size: 2rem; font-weight: bold; line-height: 1; color: #94a3b8; display: inline-block; }
    .arrow-right { animation: nudge-x 1.2s ease-in-out infinite; }
    .arrow-down { animation: nudge-y 1.2s ease-in-out infinite; }
    @keyframes nudge-x { 0%, 100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
    @keyframes nudge-y { 0%, 100% { transform: translateY(-4px); } 50% { transform: translateY(4px); } }
    /* soft halo so the title stays readable over the moving graph, and a gentle entrance */
    .t-halo { text-shadow: 0 0 28px rgba(255, 255, 255, .95), 0 0 8px rgba(255, 255, 255, .85); }
    .t-in { animation: t-in 1s cubic-bezier(.22, .61, .36, 1) both; }
    .t-in-late { animation-delay: .45s; }
    @keyframes t-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .t-in { animation: none; }
      .wave { display: none; }
    }
  </style>
</head>
